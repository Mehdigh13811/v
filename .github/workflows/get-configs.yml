name: Refresh VPN Configs

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json

      - name: Fetch all configs
        run: |
          mkdir -p configs
          php <<'PHP_RUN'
          <?php
          $servers = [
              '8e4aff22a236a0248110950e2bc004e3' => ['name' => 'لندن 1', 'flag' => '🇬🇧', 'free' => false],
              '103dcdb655fdc8f190fad5103eff7b1c' => ['name' => 'لندن 2', 'flag' => '🇬🇧', 'free' => false],
              '1b53a629cd6c462a0fc79c5b443a18f2' => ['name' => 'لندن 3', 'flag' => '🇬🇧', 'free' => false],
              '3032ab5f733e32987fb8c558a1ab6bd8' => ['name' => 'لندن 4', 'flag' => '🇬🇧', 'free' => true],
              '443f285884c2ee2ba1c2d413c4b061b1' => ['name' => 'لندن 6', 'flag' => '🇬🇧', 'free' => true],
              '65fb9a7eda69a2c86c5aab403c6f6a68' => ['name' => 'لندن 7', 'flag' => '🇬🇧', 'free' => false],
              'cf787aff3d5abb2d6874cd07829c059d' => ['name' => 'لندن 8', 'flag' => '🇬🇧', 'free' => false],
              '2e11f3164e78621056ebe3b9420263cd' => ['name' => 'لندن 9', 'flag' => '🇬🇧', 'free' => false],
              'aa9b688d11f6f00f5e35df9432ab8787' => ['name' => 'تورنتو 6', 'flag' => '🇨🇦', 'free' => false],
              '41f4b39ecd01db60722cc1e9a49021ea' => ['name' => 'هلسینکی', 'flag' => '🇫🇮', 'free' => false],
              'ccaf9df13557073f4c665a55471c06dd' => ['name' => 'هلسینکی 2', 'flag' => '🇫🇮', 'free' => false],
              '584c39263735f278be00f8c77616d71d' => ['name' => 'پاریس 2', 'flag' => '🇫🇷', 'free' => false],
              '7e12a316c18322a66095af6404701691' => ['name' => 'پاریس 5', 'flag' => '🇫🇷', 'free' => false],
              'd604037ab01a04334c58f83f3e6fb022' => ['name' => 'لیمبرگ', 'flag' => '🇩🇪', 'free' => false],
              '0bab23ed9c9d495b380deba981e1ae5b' => ['name' => 'نورنبرگ', 'flag' => '🇩🇪', 'free' => false],
              'ff4f5e5271dda705d21eb96030c78542' => ['name' => 'ریگا', 'flag' => '🇱🇻', 'free' => false],
              '93ab5b85e1dc72c92e2e930d9d862da6' => ['name' => 'آمستردام', 'flag' => '🇳🇱', 'free' => false],
              '76207c1dec9e7ebdcd6602c1efb4626e' => ['name' => 'ملیسانت', 'flag' => '🇳🇱', 'free' => false],
              'd2edfce290994ea85d764985f0166376' => ['name' => 'مپل', 'flag' => '🇳🇱', 'free' => false],
              '7bd77605e0f24d3bc23ed2332f7889cb' => ['name' => 'فاتژ', 'flag' => '🇷🇺', 'free' => false],
              '1aaae679966b26801ff37fad781c704d' => ['name' => 'سنگاپور 1', 'flag' => '🇸🇬', 'free' => false],
              'a95c8029def4dd562e3d2352b80d853a' => ['name' => 'سنگاپور 3', 'flag' => '🇸🇬', 'free' => false],
              '2dee89dc102e525673c3a05153427500' => ['name' => 'خارکیف', 'flag' => '🇺🇦', 'free' => false],
              'b2d5157151f6586e22caab5f45e6c5e6' => ['name' => 'آتلانتا 1', 'flag' => '🇺🇸', 'free' => false],
              '44cc9ada5920ca8efd31c7496b262191' => ['name' => 'نیویورک', 'flag' => '🇺🇸', 'free' => false],
              'cb91ece95a73ae0283ec3719ab759f90' => ['name' => 'استانبل 8', 'flag' => '🇹🇷', 'free' => false],
              '6b5a3c3e2b9b4e6b965a639f4664e446' => ['name' => 'استانبل 3', 'flag' => '🇹🇷', 'free' => false],
          ];

          function fetchConfig($hash) {
              $url = "https://api.tap2free.net/api/uk-server?ip=" . $hash;
              $ch = curl_init();
              curl_setopt_array($ch, [
                  CURLOPT_URL => $url,
                  CURLOPT_RETURNTRANSFER => true,
                  CURLOPT_SSL_VERIFYPEER => false,
                  CURLOPT_SSL_VERIFYHOST => false,
                  CURLOPT_TIMEOUT => 20,
                  CURLOPT_HTTPHEADER => [
                      'app-id: 213ad4ebd8dc7dede87d9ebda0d82fe6',
                      'Accept: application/json',
                      'User-Agent: okhttp/5.0.0'
                  ]
              ]);
              $response = curl_exec($ch);
              $httpCode = curl_getinfo($ch, CURLINFO_HTTP_CODE);
              curl_close($ch);
              if ($httpCode != 200 || !$response) return false;
              $data = json_decode($response, true);
              return isset($data['config']) ? $data['config'] : false;
          }

          $ok = 0;
          $fail = 0;
          $index = [];

          foreach ($servers as $hash => $info) {
              $config = fetchConfig($hash);
              if ($config !== false) {
                  $entry = [
                      'hash' => $hash,
                      'name' => $info['name'],
                      'flag' => $info['flag'],
                      'free' => $info['free'],
                      'config' => $config,
                      'updated_at' => date('c'),
                  ];
                  file_put_contents("configs/{$hash}.json",
                      json_encode($entry, JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES));
                  $index[$hash] = [
                      'name' => $info['name'],
                      'flag' => $info['flag'],
                      'free' => $info['free'],
                      'updated_at' => date('c'),
                  ];
                  echo "OK   : {$info['name']}\n";
                  $ok++;
              } else {
                  echo "FAIL : {$info['name']}\n";
                  $fail++;
              }
          }

          file_put_contents('configs/index.json',
              json_encode([
                  'updated_at' => date('c'),
                  'total' => count($servers),
                  'success' => $ok,
                  'failed' => $fail,
                  'servers' => $index,
              ], JSON_UNESCAPED_UNICODE | JSON_UNESCAPED_SLASHES | JSON_PRETTY_PRINT));

          echo "Success: {$ok}, Failed: {$fail}\n";
          PHP_RUN

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh configs $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
